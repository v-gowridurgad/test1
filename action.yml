name: 'Composite Action Example'
description: 'A composite action to checkout code and set up Node.js'
runs:
  using: 'composite'
  steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Node.js
      uses: v-mahabaleshwars/setup-node@feature/852-absolute-path
      with:
        node-version-file: ${{ github.action_path }}/.mise.toml
    

